# Version macOS (Apple Silicon et Intel), fabriquée sur les Mac gratuits de GitHub pour les dépôts publics.
# Se lance tout seul à la publication d'une release (npm run release:win) et y ajoute les .dmg.
# Lancement à la main (onglet Actions) : sans tag, les .dmg sont seulement joints au résultat, pour essai.
name: Version macOS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release à compléter (ex. v1.2.1) ; vide pour un simple essai
        required: false

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fabrication (arm64 et x64)
        run: npm run dist
        env:
          # Pas de certificat Apple : signature « ad hoc » (identity "-" dans electron-builder.yml)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Ajout à la release
        if: env.TAG != ''
        run: gh release upload "$TAG" release/*.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Résultat de l'essai
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: lumen-tex-macos
          path: release/*.dmg
          retention-days: 7
