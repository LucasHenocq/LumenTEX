<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8F72FF"/>
      <stop offset="0.55" stop-color="#6247EA"/>
      <stop offset="1" stop-color="#3B2DB8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#FFE7A3" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#FFD166" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEAFF"/>
    </linearGradient>
    <linearGradient id="lam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B5CFF"/>
      <stop offset="1" stop-color="#3B2DB8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B1060" flood-opacity="0.38"/>
    </filter>
    <filter id="pshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#180C5C" flood-opacity="0.42"/>
    </filter>
    <filter id="sparkglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- Fond (grille d'icône macOS : 824 px) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <!-- motif discret de lignes de base -->
    <g stroke="#fff" stroke-opacity="0.06" stroke-width="3">
      <path d="M100 300 H924 M100 380 H924 M100 460 H924 M100 540 H924 M100 620 H924 M100 700 H924 M100 780 H924 M100 860 H924"/>
    </g>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Page -->
  <g transform="rotate(-7 500 540)" filter="url(#pshadow)">
    <path d="M330 250 H600 L700 350 V800 a28 28 0 0 1 -28 28 H330 a28 28 0 0 1 -28 -28 V278 a28 28 0 0 1 28 -28 Z" fill="url(#paper)"/>
    <path d="M600 250 V322 a28 28 0 0 0 28 28 H700 Z" fill="#D9D2FF"/>
    <g fill="#CFC7F5">
      <rect x="352" y="700" width="296" height="16" rx="8"/>
      <rect x="352" y="742" width="210" height="16" rx="8"/>
      <rect x="352" y="300" width="150" height="16" rx="8"/>
    </g>
    <text x="498" y="640" text-anchor="middle" font-family="'Times New Roman', 'STIX Two Text', Georgia, serif" font-style="italic" font-size="360" fill="url(#lam)">λ</text>
  </g>

  <!-- Étincelle « lumen » -->
  <g transform="translate(714 286)" filter="url(#sparkglow)">
    <path d="M0 -92 C10 -26 26 -10 92 0 C26 10 10 26 0 92 C-10 26 -26 10 -92 0 C-26 -10 -10 -26 0 -92 Z" fill="#FFE08A"/>
    <circle r="20" fill="#FFF6D8"/>
  </g>
</svg>
