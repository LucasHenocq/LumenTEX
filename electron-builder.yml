appId: com.lumentex.app
productName: Lumen TeX
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
# Modules natifs de Hyperswarm (udx, sodium) : binaires précompilés fournis, pas de recompilation
npmRebuild: false
# macOS, sans compte développeur Apple : signature « ad hoc » (sans elle, macOS déclare l'app « endommagée » sur
# les Mac Apple Silicon) ; le hardened runtime ne sert qu'à la notarisation, qui demande ce compte
mac:
  category: public.app-category.productivity
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: Lumen-TeX-${version}-${arch}.${ext}
  icon: build/icon.png
# Linux : AppImage (toutes distributions) et .deb (Ubuntu, Debian : profil AppArmor inclus, nécessaire depuis
# Ubuntu 24.04) ; les deux se mettent à jour par electron-updater (latest-linux.yml)
linux:
  category: Office
  icon: build/icon.png
  maintainer: Lucas Henocq <LucasHenocq@users.noreply.github.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: Lumen-TeX-${version}-${arch}.${ext}
win:
  icon: build/icon.png
  target: nsis
# Installeur Windows : assistant en français, installation pour l'utilisateur (sans droits administrateur)
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Lumen TeX
  runAfterFinish: true
  language: "1036"
  artifactName: Lumen-TeX-Setup-${version}.exe
# Releases GitHub : installeur + latest.yml, lus par les mises à jour automatiques (electron-updater)
publish:
  provider: github
  owner: LucasHenocq
  repo: LumenTEX
  releaseType: release
fileAssociations:
  - ext: tex
    name: Document LaTeX
    role: Editor
  - ext: bib
    name: Bibliographie BibTeX
    role: Editor
